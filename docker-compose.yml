services:
  web:
    build: .
    image: birdlake-web
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      SECRET_KEY: dev-only-change-me
    volumes:
      - lake_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lake_data:
